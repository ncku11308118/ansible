services:
  kestra:
    image: kestra/kestra:latest
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra-data:/app/storage
      - kestra-db:/app/data
      - /tmp:/tmp
    user: root
    command:
      - server
      - local

volumes:
  kestra-data:

  kestra-db:
